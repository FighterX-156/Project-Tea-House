<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Fontawsome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Tailwind -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#F4F4F4]">
    <header class="Hero-section w-11/12 mx-auto ">
      <div class="Hero-container grid grid-cols-2 justify-center p-4">
        <div class="Hero-text flex flex-col justify-center gap-6">
          <span class="Title-text space-y-3">
            <p class="text-6xl font-bold">
            It's good <br> tea time at The <br> Tea House
          </p>
          <p class="text-2xl font-light">
            Tea and Botanical Solutions Supplier Give Optimum Satisfaction To
            Your Taste Buds.
          </p>
          </span>
          
          
          <button
            class="btn bg-gradient-to-r from-[#FF0000] to-[#FF8938] text-white w-4/12"
          >
            Explore More <i class="fa-solid fa-location-arrow"></i>
          </button>
        </div>
        <div class="Hero-pic relative flex justify-center">
          <img src="./images/banner.png" alt="Banner-Cups"  />
          <div class="Rating bg-white rounded-lg flex gap-4 p-4 justify-center items-center w-4/12 absolute bottom-3 left-40 shadow-2xl">
            <img src="./images/Star.png" alt="Rating-Star"  />
            <div class="Rating-text">
              <p class="font-bold  text-2xl">5.00</p>
              <p class="font-light text-xl">Trust Pilot Ratings</p>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
